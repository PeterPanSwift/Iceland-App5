name: Build, Record and Capture App Store Screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - 'IcelandAtlas/**'
      - 'IcelandAtlasUITests/**'
      - 'project.yml'
      - 'scripts/capture.sh'
      - '.github/workflows/record-demo.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tools
        run: |
          command -v xcodegen || brew install xcodegen
          command -v ffmpeg || brew install ffmpeg
          xcodebuild -version
          xcodegen generate
      - name: Build, verify and capture
        run: bash scripts/capture.sh
      - name: Upload media and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Iceland-iPhone18ProMax-Xcode27
          path: |
            media/
            IcelandAtlas.xcodeproj/
          retention-days: 30
