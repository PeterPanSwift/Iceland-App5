name: IcelandAtlas
options:
  bundleIdPrefix: com.peterpanswift
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  IcelandAtlas:
    type: application
    platform: iOS
    sources: [IcelandAtlas]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peterpanswift.IcelandAtlas
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 'Ísland 冰島'
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  IcelandAtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [IcelandAtlasUITests]
    dependencies:
      - target: IcelandAtlas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  IcelandAtlas:
    build:
      targets:
        IcelandAtlas: all
        IcelandAtlasUITests: [test]
    test:
      targets: [IcelandAtlasUITests]
